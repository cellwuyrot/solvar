# Template only. Merge with the hosting provider's existing TLS configuration; do NOT overwrite it blindly.
# The limit_* zones and map belong inside the http {} context, not server {}.
limit_req_zone $binary_remote_addr zone=solvar_orders:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=solvar_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=solvar_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=solvar_connections:10m;

